---
# See: https://docs.docker.com/engine/install/ubuntu/

- name: Ensure old versions of Docker are not installed
  ansible.builtin.apt:
    name:
      - containerd
      - docker
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - docker-engine
      - docker.io
      - podman-docker
      - runc
    state: absent

- name: Create directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG apt key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/ubuntu/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
  register: docker_repository

# Servers provisioned before the move to deb822 have the same repository in
# docker.list; apt would warn about it being configured twice.
- name: Remove the one-line Docker source list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  register: docker_old_list

- name: Update the apt cache after a repository change
  ansible.builtin.apt:
    update_cache: true
  when: docker_repository is changed or docker_old_list is changed

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
  notify:
    - Restart docker
