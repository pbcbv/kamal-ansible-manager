---
- name: Ensure apt key is not present in trusted.gpg.d
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/docker.asc
    state: absent

- name: Ensure the repo referencing the previous trusted.gpg.d key is not present
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/docker.list
    regexp: 'signed-by=/etc/apt/trusted\.gpg\.d/docker\.asc'
    state: absent

- name: Upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: true

- name: Install packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - build-essential
      - ca-certificates
      - chrony
      - curl
      - duf
      - fail2ban
      - git
      - gnupg
      - htop
      - python3-debian
      - ufw
      - unattended-upgrades
      - vim
    state: latest
    update_cache: true
    autoremove: true
    autoclean: true
  notify:
    - Start chrony
    - Start fail2ban

- name: Remove snap
  ansible.builtin.apt:
    name:
      - snapd
      - snap
    state: absent
    purge: true
